<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Command Center</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='2' fill='%231c2733'/%3E%3Crect x='2' y='3' width='3' height='10' fill='%232f7d5b'/%3E%3Crect x='6' y='3' width='8' height='4' fill='%23e6ecf1'/%3E%3Crect x='6' y='9' width='8' height='4' fill='%23e6ecf1'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="bar">
      <div class="brand">CCC</div>
      <nav class="tabs" aria-label="Sections">
        <button type="button" data-tab="board" aria-current="page">Board</button>
        <button type="button" data-tab="questions">Questions <span class="count" id="q-count"></span></button>
        <button type="button" data-tab="tasks">Tasks</button>
        <button type="button" data-tab="controls">Controls</button>
      </nav>
      <label class="project-pick">Project <select id="project" aria-label="Project"></select></label>
      <span class="live" id="live" title="Live updates">offline</span>
    </header>
    <main id="view"></main>
    <dialog id="detail" class="drawer" aria-labelledby="detail-title"></dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
